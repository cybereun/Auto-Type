name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "VERSION 파일의 버전으로 GitHub 릴리스 만들기"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64 "-DAUTOTYPE_VERSION=${{ steps.version.outputs.value }}"
          cmake --build build-x64 --config Release

      - name: Build x86
        run: |
          cmake -S . -B build-x86 -A Win32 "-DAUTOTYPE_VERSION=${{ steps.version.outputs.value }}"
          cmake --build build-x86 --config Release

      - name: Engine tests
        shell: cmd
        run: build-x64\Release\engine_test.exe resources\model-v2.dat

      - name: Installer (exe)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\AutoType.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/x64, pkg/x86 | Out-Null
          Copy-Item build-x64/Release/AutoType.dll pkg/x64/
          Copy-Item build-x86/Release/AutoType.dll pkg/x86/
          Copy-Item scripts/install.bat, scripts/uninstall.bat, README.md, LICENSE, THIRD_PARTY_NOTICES.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "out/AutoType-${{ steps.version.outputs.value }}-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AutoType-${{ steps.version.outputs.value }}
          path: out/

      - name: GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Auto-Type ${{ steps.version.outputs.value }}
          files: out/*
          body: |
            ## 설치
            1. `AutoType-Setup-${{ steps.version.outputs.value }}.exe` 를 받아 실행합니다 (관리자 권한 요청이 뜨면 "예").
            2. **Win + Space** 로 `Auto-Type (한영 자동)` 을 고릅니다.
            3. 이미 열려 있던 앱은 다시 실행해야 인식합니다.

            원래 입력기로 돌아가기: **Win + Space** → `Microsoft 입력기`
            제거: 설정 → 앱 → 설치된 앱 → `Auto-Type` → 제거

            > 코드 서명 전이라 SmartScreen 경고가 뜨면 **추가 정보 → 실행** 을 누르세요.

            `portable.zip` 은 설치 프로그램 없이 `install.bat` 으로 등록하는 수동 설치판입니다.
