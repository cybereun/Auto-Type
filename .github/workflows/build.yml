name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64
          cmake --build build-x64 --config Release
      - name: Build x86
        run: |
          cmake -S . -B build-x86 -A Win32
          cmake --build build-x86 --config Release
      - name: Engine tests
        run: build-x64\Release\engine_test.exe resources\model-v2.dat
        shell: cmd
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/x64, out/x86 | Out-Null
          Copy-Item build-x64/Release/AutoType.dll out/x64/
          Copy-Item build-x86/Release/AutoType.dll out/x86/
          Copy-Item scripts/install.bat, scripts/uninstall.bat, README.md, THIRD_PARTY_NOTICES.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: AutoType-windows
          path: out/
